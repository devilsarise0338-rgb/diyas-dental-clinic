<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 50" fill="none">
  <!-- Modern Geometric Tooth + Smile Emblem -->
  <g transform="translate(4, 3)">
    <rect width="44" height="44" rx="12" fill="#2563EB" />
    <!-- Subtle glow overlay -->
    <rect width="44" height="44" rx="12" fill="url(#blue-grad)" />
    <!-- Modern Stylized Tooth with Smile curve -->
    <path d="M22 10C17.5 10 14 13.5 14 18C14 22 16.5 24.5 17.5 28C18.5 31.5 20 35 22 35C24 35 25.5 31.5 26.5 28C27.5 24.5 30 22 30 18C30 13.5 26.5 10 22 10Z" fill="white" fill-opacity="0.95"/>
    <path d="M17.5 21C19 23.5 25 23.5 26.5 21" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
    <!-- Medical Plus Accent in Mint -->
    <circle cx="34" cy="12" r="5" fill="#10B981" />
    <path d="M34 9.5V14.5M31.5 12H36.5" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  
  <!-- Clinic Typography -->
  <text x="58" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="16" fill="#0F172A" letter-spacing="-0.02em">DIYA'S DENTAL</text>
  <text x="58" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="10.5" fill="#64748B" letter-spacing="0.04em">AND GENERAL CARE CLINIC</text>

  <defs>
    <linearGradient id="blue-grad" x1="0" y1="0" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>
</svg>
