<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="600" y2="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1E3A8A"/>
      <stop offset="0.5" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="chairGrad" x1="200" y1="120" x2="450" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E2E8F0"/>
    </linearGradient>
    <radialGradient id="ambientLight" cx="300" cy="180" r="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#60A5FA" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#1E3A8A" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Studio Atmosphere -->
  <rect width="600" height="380" rx="16" fill="url(#bgGrad)"/>
  <rect width="600" height="380" rx="16" fill="url(#ambientLight)"/>

  <!-- Architecture Grid / Perspective Flooring -->
  <path d="M0 260 L600 260" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1.5"/>
  <path d="M0 320 L600 320" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5"/>
  <path d="M120 260 L60 380" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1.5"/>
  <path d="M260 260 L220 380" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1.5"/>
  <path d="M400 260 L420 380" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1.5"/>
  <path d="M520 260 L570 380" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1.5"/>

  <!-- High-Tech Overhead Dental Lamp -->
  <path d="M420 40 L380 120" stroke="#93C5FD" stroke-width="6" stroke-linecap="round"/>
  <path d="M380 120 L320 135" stroke="#BFDBFE" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="305" cy="140" rx="30" ry="12" fill="#FFFFFF" filter="url(#softGlow)"/>
  <polygon points="280,145 180,270 380,270 330,145" fill="#FFFFFF" fill-opacity="0.06"/>

  <!-- Ergonomic Dental Chair (Modern Minimalist Geometry) -->
  <!-- Base Stand -->
  <rect x="290" y="270" width="30" height="45" rx="4" fill="#94A3B8"/>
  <ellipse cx="305" cy="315" rx="55" ry="14" fill="#64748B"/>
  
  <!-- Reclined Chair Body -->
  <path d="M190 220 Q220 240 270 245 L370 240 Q410 235 435 210 Q445 200 440 190 Q435 180 420 185 L350 205 Q290 205 240 190 L195 195 Q180 200 190 220 Z" fill="url(#chairGrad)"/>
  <!-- Headrest -->
  <rect x="155" y="185" width="35" height="22" rx="8" fill="#F8FAFC"/>
  <!-- Armrest -->
  <path d="M260 215 C280 215 320 220 340 210" stroke="#CBD5E1" stroke-width="8" stroke-linecap="round"/>

  <!-- Digital Equipment Screen & Tray -->
  <path d="M440 250 L470 170" stroke="#94A3B8" stroke-width="5" stroke-linecap="round"/>
  <rect x="440" y="130" width="70" height="44" rx="6" fill="#0F172A" stroke="#3B82F6" stroke-width="2"/>
  <!-- Screen Waveform / Dental Scan lines -->
  <path d="M450 152 Q460 142 470 155 T490 148 T500 152" stroke="#10B981" stroke-width="2" fill="none"/>
  <circle cx="495" cy="142" r="3" fill="#10B981"/>

  <!-- Modern Glass Partition with Leaf Plant Accent -->
  <rect x="40" y="90" width="90" height="190" rx="8" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.15"/>
  <circle cx="85" cy="270" r="14" fill="#E2E8F0" fill-opacity="0.2"/>
  <path d="M85 270 Q95 230 75 210 Q85 190 100 180" stroke="#10B981" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M85 270 Q65 240 60 220" stroke="#34D399" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Floating UI Highlight Cards (Bento Detail) -->
  <g transform="translate(30, 30)">
    <rect width="180" height="48" rx="10" fill="#0B1B3A" fill-opacity="0.75" stroke="#3B82F6" stroke-opacity="0.4"/>
    <circle cx="24" cy="24" r="8" fill="#10B981" fill-opacity="0.2"/>
    <circle cx="24" cy="24" r="4" fill="#10B981"/>
    <text x="42" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#FFFFFF">100% Sterile Tech</text>
    <text x="42" y="34" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="9" fill="#94A3B8">Mansarovar, Jaipur</text>
  </g>

  <!-- Sparkles & Highlights -->
  <path d="M510 60 L514 70 L524 74 L514 78 L510 88 L506 78 L496 74 L506 70 Z" fill="#FBBF24" opacity="0.8"/>
  <circle cx="160" cy="80" r="2" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="540" cy="180" r="3" fill="#FFFFFF" opacity="0.5"/>
</svg>
