<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" fill="none">
  <defs>
    <linearGradient id="docBg2" x1="0" y1="0" x2="320" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F0FDF4"/>
      <stop offset="1" stop-color="#DCFCE7"/>
    </linearGradient>
    <linearGradient id="coatGrad2" x1="100" y1="180" x2="220" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F8FAFC"/>
    </linearGradient>
  </defs>

  <!-- Circular Avatar Background -->
  <circle cx="160" cy="160" r="150" fill="url(#docBg2)" stroke="#10B981" stroke-opacity="0.2" stroke-width="4"/>
  
  <!-- Subtle Medical Accent Halo -->
  <circle cx="160" cy="160" r="130" stroke="#10B981" stroke-opacity="0.1" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Senior Doctor Silhouette / Illustration -->
  <!-- Hair (Distinguished, side-parted) -->
  <path d="M120 115 C118 78 138 62 160 62 C182 62 202 78 200 115 C200 120 198 128 196 132 C192 118 186 92 160 92 C134 92 128 118 124 132 C122 128 120 120 120 115 Z" fill="#334155"/>
  <path d="M125 90 C135 75 160 70 170 70 C185 70 195 80 195 95 C185 86 170 82 155 85 C140 88 132 92 125 90 Z" fill="#64748B"/> <!-- Silver accents for distinguished experience -->

  <!-- Face -->
  <ellipse cx="160" cy="122" rx="33" ry="38" fill="#FBD5B5"/>

  <!-- Ears -->
  <circle cx="125" cy="124" r="7" fill="#F5C29A"/>
  <circle cx="195" cy="124" r="7" fill="#F5C29A"/>

  <!-- Sophisticated Rimless / Wireframe Glasses -->
  <rect x="136" y="112" width="18" height="13" rx="4" fill="none" stroke="#2563EB" stroke-width="2"/>
  <rect x="166" y="112" width="18" height="13" rx="4" fill="none" stroke="#2563EB" stroke-width="2"/>
  <line x1="154" y1="117" x2="166" y2="117" stroke="#2563EB" stroke-width="2"/>

  <!-- Eyes behind glasses -->
  <ellipse cx="145" cy="118" rx="2.5" ry="2.5" fill="#1E293B"/>
  <ellipse cx="175" cy="118" rx="2.5" ry="2.5" fill="#1E293B"/>

  <!-- Eyebrows -->
  <path d="M138 107 Q145 104 152 108" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
  <path d="M168 108 Q175 104 182 107" stroke="#475569" stroke-width="2" stroke-linecap="round"/>

  <!-- Reassuring Senior Physician Smile -->
  <path d="M150 140 Q160 148 170 140" stroke="#C2410C" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Nose -->
  <path d="M160 120 L158 130 L162 130" stroke="#E29D76" stroke-width="2" stroke-linecap="round"/>

  <!-- Neck -->
  <path d="M147 154 L147 178 L173 178 L173 154 Z" fill="#F5C29A"/>

  <!-- Formal Shirt & Tie under Lab Coat -->
  <path d="M140 176 L180 176 L185 220 L135 220 Z" fill="#EFF6FF"/>
  <!-- Classic Navy Tie -->
  <polygon points="156,180 164,180 166,220 160,232 154,220" fill="#1E3A8A"/>

  <!-- Doctor's White Lab Coat -->
  <path d="M95 186 C115 174 135 174 135 174 L152 250 L115 310 L65 310 C60 260 75 210 95 186 Z" fill="url(#coatGrad2)" stroke="#CBD5E1" stroke-width="1.5"/>
  <path d="M225 186 C205 174 185 174 185 174 L168 250 L205 310 L255 310 C260 260 245 210 225 186 Z" fill="url(#coatGrad2)" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Physician Stethoscope -->
  <path d="M130 185 C125 210 128 245 150 255 C160 260 170 258 174 245 C178 238 180 210 190 185" stroke="#334155" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  <!-- Stethoscope Chest Piece -->
  <circle cx="156" cy="265" r="9" fill="#94A3B8" stroke="#334155" stroke-width="2"/>
  <circle cx="156" cy="265" r="5" fill="#CBD5E1"/>

  <!-- Professional Name Badge in bottom corner -->
  <g transform="translate(160, 235)">
    <rect width="145" height="34" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.06))"/>
    <text x="10" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="9.5" fill="#10B981">Dr. Gopal Lal Singhal</text>
    <text x="10" y="27" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="7.5" fill="#64748B">Senior General Physician</text>
  </g>
</svg>
